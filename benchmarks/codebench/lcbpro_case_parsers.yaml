  def case_end(lines: list[str], start: int) -> int:
      # First line: k (number of trees)
      (k,) = ints(lines, start, 1)

      idx = start + 1
      for _ in range(k):
          # For each tree: n (size)
          (n,) = ints(lines, idx, 1)
          # Then n-1 parent values
          if n > 1:
              ints(lines, idx + 1, n - 1)
              idx += 2
          else:
              idx += 1

      return idx

