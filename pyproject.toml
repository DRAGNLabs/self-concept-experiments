[project]
name = "selfconcept"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "peft>=0.14",
    "accelerate>=1.2",
    "datasets>=3.2",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "tqdm",
    # used by the capability evals, the Fisher tests in the analysis scripts, and --quant-4bit
    "lm_eval>=0.4",
    "scipy",
    "scikit-learn>=1.5",
    "bitsandbytes>=0.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"selfconcept.codebench" = ["evilgenie_templates/*.jinja"]

# torch must come from the cu126 wheels for compatibility with all supercomputer
# nodes (the default PyPI wheels break on some BYU ORC GPUs).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
