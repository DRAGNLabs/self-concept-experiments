[project]
name = "selfconcept"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime deps (torch, transformers, ...) are managed by environment.yaml (mamba), not here.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
