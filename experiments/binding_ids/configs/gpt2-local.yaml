# Local CPU smoke test of the whole pipeline on GPT-2 (small, ungated). Not a real result.
#   MIRROR_DATA_PATH=~/mirror_data python -m selfconcept.binding_ids.run --config experiments/binding_ids/configs/gpt2-local.yaml
model:
  class_path: MirrorGPTModel

metrics:
  mean_interventions:
    class_path: selfconcept.binding_ids.evaluate.MeanInterventionMetric
    init_args:
      data_path: experiments/binding_ids/data/capitals.jsonl
      estimate_data_path: experiments/binding_ids/data/capitals_estimate.jsonl
      eval_start: 100  # same eval contexts as the original last-token runs
      n_eval: 100
      output_path: experiments/binding_ids/results/gpt2-local/mean_interventions.json

slurm:
  job_type: local

device: cpu
