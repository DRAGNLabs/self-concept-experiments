# SELF tasks on OLMo-2-13B-Instruct: the ROLE contexts written by one speaker, ending "So my/your/<name>'s
# role is the ___" (no perspective flip, no verbatim repeat). Frames: model_voice user_voice plain.
# model_voice = assistant turn ("I" is the model); user_voice = user turn ("you" is the model);
# plain = no chat tags. Submit from the repo root:
#   python -m selfconcept.binding_ids.run --config experiments/binding_ids/configs/olmo2-13b-instruct-self.yaml
model:
  class_path: selfconcept.binding_ids.models.MirrorOlmoModel
  init_args:
    hf_model_name: allenai/OLMo-2-1124-13B-Instruct
    dtype: float32  # loads from the HF cache; fp32 to match the base runs
metrics:
  model_voice_you_i_neutral:
    class_path: selfconcept.binding_ids.evaluate.MeanInterventionMetric
    init_args:
      data_path: experiments/binding_ids/data/self_model_voice_you_i_neutral.jsonl
      estimate_data_path: experiments/binding_ids/data/self_model_voice_you_i_estimate.jsonl
      output_path: experiments/binding_ids/results/olmo2-13b-instruct-self/self_model_voice_you_i_neutral.json
