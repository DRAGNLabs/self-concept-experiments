# ASSISTANT tasks (user_voice) on OLMo-2-13B-Instruct: "The assistant is in the <room>. The user is in
# the <room>." Own-estimate swaps for each pair, plus transfer: binding vectors estimated on
# "others" (two person nouns, no self) applied to the assistant/user contexts. Submit from the
# repo root:
#   python -m selfconcept.binding_ids.run --config experiments/binding_ids/configs/olmo2-13b-instruct-asst-user_voice.yaml
model:
  class_path: selfconcept.binding_ids.models.MirrorOlmoModel
  init_args:
    hf_model_name: allenai/OLMo-2-1124-13B-Instruct
    dtype: float32  # loads from the HF cache; fp32 to match the base runs

metrics:
  others:
    class_path: selfconcept.binding_ids.evaluate.MeanInterventionMetric
    init_args:
      data_path: experiments/binding_ids/data/asst_user_voice_others.jsonl
      estimate_data_path: experiments/binding_ids/data/asst_user_voice_others_estimate.jsonl
      output_path: experiments/binding_ids/results/olmo2-13b-instruct-asst/asst_user_voice_others.json
  assistant_user:
    class_path: selfconcept.binding_ids.evaluate.MeanInterventionMetric
    init_args:
      data_path: experiments/binding_ids/data/asst_user_voice_assistant_user.jsonl
      estimate_data_path: experiments/binding_ids/data/asst_user_voice_assistant_user_estimate.jsonl
      output_path: experiments/binding_ids/results/olmo2-13b-instruct-asst/asst_user_voice_assistant_user.json
  assistant_other:
    class_path: selfconcept.binding_ids.evaluate.MeanInterventionMetric
    init_args:
      data_path: experiments/binding_ids/data/asst_user_voice_assistant_other.jsonl
      estimate_data_path: experiments/binding_ids/data/asst_user_voice_assistant_other_estimate.jsonl
      output_path: experiments/binding_ids/results/olmo2-13b-instruct-asst/asst_user_voice_assistant_other.json
  user_other:
    class_path: selfconcept.binding_ids.evaluate.MeanInterventionMetric
    init_args:
      data_path: experiments/binding_ids/data/asst_user_voice_user_other.jsonl
      estimate_data_path: experiments/binding_ids/data/asst_user_voice_user_other_estimate.jsonl
      output_path: experiments/binding_ids/results/olmo2-13b-instruct-asst/asst_user_voice_user_other.json
  assistant_user_from_others:
    class_path: selfconcept.binding_ids.evaluate.MeanInterventionMetric
    init_args:
      data_path: experiments/binding_ids/data/asst_user_voice_assistant_user.jsonl
      estimate_data_path: experiments/binding_ids/data/asst_user_voice_others_estimate.jsonl
      output_path: experiments/binding_ids/results/olmo2-13b-instruct-asst/asst_user_voice_assistant_user_from_others.json
  assistant_other_from_others:
    class_path: selfconcept.binding_ids.evaluate.MeanInterventionMetric
    init_args:
      data_path: experiments/binding_ids/data/asst_user_voice_assistant_other.jsonl
      estimate_data_path: experiments/binding_ids/data/asst_user_voice_others_estimate.jsonl
      output_path: experiments/binding_ids/results/olmo2-13b-instruct-asst/asst_user_voice_assistant_other_from_others.json
  user_other_from_others:
    class_path: selfconcept.binding_ids.evaluate.MeanInterventionMetric
    init_args:
      data_path: experiments/binding_ids/data/asst_user_voice_user_other.jsonl
      estimate_data_path: experiments/binding_ids/data/asst_user_voice_others_estimate.jsonl
      output_path: experiments/binding_ids/results/olmo2-13b-instruct-asst/asst_user_voice_user_other_from_others.json

slurm:
  job_type: compute
  time: "01:00:00"
  gpus_per_node: a100:1
  qos: cs
  mem_per_cpu: 16G
  output: experiments/binding_ids/slurm-logs/%j.out
