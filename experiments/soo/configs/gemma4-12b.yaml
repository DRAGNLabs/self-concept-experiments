# gemma-4-12B-it (2026-07, 48 layers): Gemma-2-27b paper recipe held
# constant (r=4, alpha=8, dropout 0.1, lr 9e-4, 8 epochs, batch 4,
# last_token) — see gemma4-31b.yaml. Default layer = 30% depth (Gemma-2's
# validated band depth); sweep overrides via --layer.
model: google/gemma-4-12B-it
layer: 14
lora_r: 4
lora_alpha: 8
lora_dropout: 0.1
lr: 0.0009
epochs: 8
batch_size: 4
soo_mode: last_token
train_data: data/train_soo_pairs.jsonl
