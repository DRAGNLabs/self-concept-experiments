# Muse strength variant A: 8x LoRA rank, same q/v targets. Depth sweeps
# (L13-L51) found no band; testing whether intervention capacity, not layer
# choice, is Muse's limiting factor. Alpha scaled to keep alpha/r = 4.
model: meta-models/Muse-Glimmer-30B
layer: 26
lora_r: 64
lora_alpha: 256
lora_dropout: 0.2
lr: 0.0001
epochs: 15
batch_size: 4
soo_mode: last_token
train_data: data/train_soo_pairs.jsonl
