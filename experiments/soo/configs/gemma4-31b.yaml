# gemma-4-31B-it (2026-07, 60 layers): Gemma-2-27b paper recipe held
# constant (r=4, alpha=8, dropout 0.1, lr 9e-4, 8 epochs, batch 4,
# last_token) to test whether LoRA's decline with model age holds within
# the Gemma family. Default layer = 30% depth, the depth where Gemma-2's
# validated L14 band sits; sweep overrides via --layer.
model: google/gemma-4-31B-it
layer: 18
lora_r: 4
lora_alpha: 8
lora_dropout: 0.1
lr: 0.0009
epochs: 8
batch_size: 4
soo_mode: last_token
train_data: data/train_soo_pairs.jsonl
# Scope LoRA to the text stack: PEFT's default suffix match on q_proj/v_proj
# also catches the vision tower, whose Gemma4ClippableLinear it cannot wrap
# (job 13562496 failure). Regex string -> re.fullmatch in PEFT.
target_modules: model\.language_model\.layers\.\d+\.self_attn\.(q_proj|v_proj)
