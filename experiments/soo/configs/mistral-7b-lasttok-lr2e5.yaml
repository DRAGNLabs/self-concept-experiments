# LR-scale test (Koby's hypothesis): Mistral's q/v weights are 4-5x smaller
# than OLMo-2-7B's, so lr=1e-4 perturbs it 2-3x more in relative terms.
# Identical to mistral-7b-lasttok.yaml but lr 2e-5 to match the relative
# perturbation OLMo experiences.
model: mistralai/Mistral-7B-Instruct-v0.2
layer: 19
lora_r: 8
lora_alpha: 32
lora_dropout: 0.2
lr: 0.00002
epochs: 15
batch_size: 4
soo_mode: last_token
train_data: data/train_soo_pairs.jsonl
