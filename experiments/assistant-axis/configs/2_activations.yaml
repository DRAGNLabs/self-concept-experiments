# Step 2: extract activations from step-1 responses. Run from experiments/assistant-axis:
#   python pipeline/2_activations.py --config configs/2_activations.yaml
# Reads responses from scratch (assistant-axis/responses); writes {role}.pt to
# scratch (assistant-axis/activations). Override for smoke runs, e.g.
#   --run.model Qwen/Qwen2.5-0.5B-Instruct --run.roles [default] --run.layers 0,1
run:
  model: google/gemma-2-27b-it
  layers: all
  batch_size: 16
  max_length: 2048
  dtype: bfloat16
