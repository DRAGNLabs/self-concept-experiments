# Step 6: generate role-susceptibility steering traces (Section 3.2.1). Run from
# experiments/assistant-axis:
#   python pipeline/6_steered_traces.py --config configs/6_steered_traces.yaml
# Reads axis.pt + layer_norms.pt from results/, questions + system prompts from data/;
# writes one {role_id}_p{prompt_index}.jsonl per role to scratch (assistant-axis/steered).
# target_layer defaults to get_config(model)'s middle layer when null.
run:
  model: google/gemma-2-27b-it
  axis_path: results/axis.pt
  norms_path: results/layer_norms.pt
  questions_file: data/behavioral_questions.jsonl
  system_prompts_file: data/steer_prompts.jsonl
  target_layer: null
  coefficients: [-8.0, -4.0, 4.0, 8.0]
  include_baseline: true
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  dtype: bfloat16
