# Rare regime: a random target-eligible arm hits the target ~1/1000 per seed; per world ~1-3 problems have an arm
# above 5% and ~6-12 above 1%. Parameters near the rh_hillclimb transfer-model estimates (2026-10-16).
output_dir: ~/nobackup/autodelete/self-concept-experiments/arm_search_toy_v2/rare_target_coverage
replicate_count: 8
world:
  problem_count: 200
  benchmark_count: 2
  setting_levels_by_name:
    prompt: [critical, critical_no_carve, strict]
    budget: [unstated, stated]
    effort: [low, high]
  cost_multiplier_by_level_by_setting:
    effort: {high: 2.0}
  term_truths:
    - intercept_by_benchmark: [-8.0, -9.5]
      problem_spread: 2.5
      wording_effect: 0.96
      wording_problem_spread: 0.6
      effect_by_level_by_setting:
        prompt: {critical_no_carve: -0.85, strict: -2.85}
        budget: {stated: 0.8}
        effort: {high: 0.3}
    - intercept_by_benchmark: [-1.0, -1.5]
      problem_spread: 2.0
      wording_effect: -0.3
      wording_problem_spread: 0.8
      effect_by_level_by_setting:
        prompt: {critical_no_carve: -0.12, strict: -0.73}
        budget: {stated: 0.55}
    - intercept_by_benchmark: [1.5, -1.0]
      problem_spread: 2.0
      wording_effect: 0.0
      wording_problem_spread: 0.0
      effect_by_level_by_setting:
        prompt: {strict: -0.3}
        budget: {stated: 0.3}
  truth_seed: 0
priors:
  intercept_mean: -3.0
  intercept_sd: 3.0
  effect_sd: 1.0
  effect_term_spread_sd: 0.5
  group_spread_sd: 2.0
sampler_settings:
  chains: 4
  draws_per_chain: 250
  tune: 500
  target_accept: 0.9
  random_seed: 0
candidate_limits:
  groups_per_draw: 10
  conditions_per_draw: 3
  max_candidates: 1000
max_r_hat: 1.05
max_divergences: 5
search:
  seeds_per_unit: 2
  units_per_batch: 32
  min_expected_hits: 0.05
  reported_arm_count: 10
  stop_conditions:
    reward_target: null
    min_value_per_cost: null
cost_budget: 6400
reported_cost_checkpoints: [800, 1600, 3200, 6400]
