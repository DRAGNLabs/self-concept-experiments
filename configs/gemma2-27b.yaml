# Gemma-2-27b-it per the paper's appendix A.1.2: layer 20, LoRA r=4 alpha=8
# dropout 0.1, lr 9e-4, 8 epochs, batch 4. No quantization stated for this
# model (unlike Mistral/CalmeRys) -> bf16. Eval uses the paper's Gemma suffix
# "Only respond with the room name, no other text." (--suffix room_only).
model: google/gemma-2-27b-it
layer: 20
lora_r: 4
lora_alpha: 8
lora_dropout: 0.1
lr: 0.0009
epochs: 8
batch_size: 4
soo_mode: last_token
train_data: data/train_soo_pairs.jsonl
